name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dur_dashboard.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build DUR Dashboard
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DUR_Dashboard dur_dashboard.py

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\DUR_Dashboard.exe release\DUR_Dashboard.exe
          Set-Content -Path release\README.txt -Encoding UTF8 -Value @'
          DUR Dashboard
          =============
          1. DUR_Dashboard.exe를 실행합니다.
          2. 왼쪽 기준파일 관리 영역에서 8개 DUR Excel 원본을 등록합니다.
          3. 품목명 일부를 입력하여 후보 품목을 선택합니다.
          4. 7개 DUR 카드와 상세정보를 확인합니다.

          프로그램은 등록한 Excel을 사용자 PC의 로컬 영역으로 복사하고 로컬 검색 인덱스를 만듭니다.
          원본 DUR 파일이 갱신되면 해당 항목의 Excel을 다시 등록하세요.
          '@
          Compress-Archive -Path release\* -DestinationPath DUR_Dashboard_Windows.zip -Force

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DUR-Dashboard-Windows
          path: DUR_Dashboard_Windows.zip
          if-no-files-found: error
          retention-days: 30
