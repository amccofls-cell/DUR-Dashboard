name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dur_dashboard.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build DUR Dashboard
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DUR_Dashboard dur_dashboard.py

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\DUR_Dashboard.exe release\DUR_Dashboard.exe
          Set-Content -Path release\README.txt -Encoding UTF8 -Value @'
          DUR Dashboard v1.3
          ==================
          1. DUR_Dashboard.exe를 실행합니다.
          2. 상단 '기준파일 관리'에서 8개 DUR Excel을 한 번에 선택합니다.
          3. 프로그램이 파일을 자동 분류한 뒤 모든 시트를 인덱싱합니다.
          4. 'DUR 조회'에서 여러 품목을 쉼표/세미콜론 또는 여러 줄로 입력합니다.
          5. 약품별 결과와 DUR 종류별 결과를 확인합니다.

          병용금기 급여/비급여 파일은 A,D,F,G,J,M,N,O 열만 인덱싱합니다.
          등록 Excel과 검색 인덱스는 사용자 PC의 로컬 영역에만 저장됩니다.
          '@
          Compress-Archive -Path release\* -DestinationPath DUR_Dashboard_Windows.zip -Force

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DUR-Dashboard-Windows
          path: DUR_Dashboard_Windows.zip
          if-no-files-found: error
          retention-days: 30
